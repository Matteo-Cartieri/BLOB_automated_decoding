template_id: xor_compressed
encoding_family: xor_compressed
short_description: Payload obfuscated with a (typically single-byte or short repeating-key) XOR layer, wrapping a compressed blob (e.g. zlib/gzip)
typical_magic_bytes_or_signatures:
  - "no reliable magic before XOR removal; after XOR-decoding with the correct key, expect standard compression signatures (e.g. 0x78 0x9C for zlib, 0x1F 0x8B for gzip)"
  - "high byte-value entropy with a suspiciously short repeating period, suggesting a repeating XOR key"
required_python_libraries: zlib, itertools  
minimal_decoder_snippet: |
  import zlib
  import itertools
 
  def xor_bytes(data: bytes, key: bytes) -> bytes:
      return bytes(b ^ k for b, k in zip(data, itertools.cycle(key)))
 
  def decode_blob(blob: bytes, xor_key: bytes = b"\x00"):
      deobfuscated = xor_bytes(blob, xor_key)
      return zlib.decompress(deobfuscated)
expected_output_type: bytes (raw decompressed payload; may require a further decoding step, e.g. json.loads)
common_failure_conditions:
  - XOR key unknown or guessed incorrectly (results in garbage/non-decompressible bytes)
  - key length mismatch causes only partial correct deobfuscation
  - XOR applied after compression vs before compression (order confusion)
  - decompression fails even with correct key due to additional framing/headers
  - brute-forcing single-byte XOR key (256 attempts) needed when key is not known in advance