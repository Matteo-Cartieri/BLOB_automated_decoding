template_id: lz4_json
encoding_family: lz4_json
short_description: LZ4-compressed UTF-8 JSON payload
typical_magic_bytes_or_signatures:
  - "0x04 0x22 0x4D 0x18"  # LZ4 frame format magic number
required_python_libraries: lz4.frame, json
minimal_decoder_snippet: |
    import json
    import lz4.frame

    def decode_blob(blob: bytes):
        raw = lz4.frame.decompress(blob)
        return json.loads(raw.decode("utf-8"))
expected_output_type: dict | list
common_failure_conditions:
    - missing lz4 library
    - invalid frame header
    - decompressed payload is not valid JSON
